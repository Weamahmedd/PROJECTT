<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cartify — Forgot Password</title>
    <meta name="description" content="Reset your Cartify account password securely." />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet" />

    <!-- Animate CSS -->
    <link rel="stylesheet" href="./CSS/animate.min.css" />
    <!-- WOW CSS -->
    <link rel="stylesheet" href="./CSS/wow.min.css" />
    <!-- Font Awesome -->
    <link rel="stylesheet" href="./CSS/all.min.css" />
    <!-- Bootstrap -->
    <link rel="stylesheet" href="./CSS/bootstrap.min.css" />
    <!-- MDB Bootstrap -->
    <link rel="stylesheet" href="./CSS/mdb.min.css" />
    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="./CSS/Style.css" />
    <!-- Auth Screens -->
    <link rel="stylesheet" href="./CSS/auth-screens.css" />
    <!-- EmailJS -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  </head>

  <body class="auth-page min-vh-100 d-flex flex-column align-items-center justify-content-center bg-light m-0">
    <div class="container d-flex flex-column align-items-center px-3">


      <!-- Card -->
      <div class="login-container bg-white rounded-5 shadow-lg p-5 animate__animated animate__zoomIn animate__faster" style="max-width: 520px; width: 100%;">

        <!-- Icon -->
        <div class="d-flex align-items-center justify-content-center mx-auto mb-3 wow animate__animated animate__bounceIn" data-wow-delay="0.3s">
          <div class="auth-icon-circle">
            <i class="fa-solid fa-key"></i>
          </div>
        </div>

        <!-- Title -->
        <div class="text-center mb-4 wow animate__animated animate__fadeInUp" data-wow-delay="0.4s">
          <h1 class="h4 fw-bold mb-1 header-title">Forgot Password</h1>
          <p class="text-muted small mb-0">Enter your email address and we'll send a<br>verification code to reset your password.</p>
        </div>

        <!-- Form -->
        <form id="forgot-form">
          <div class="mb-3 wow animate__animated animate__fadeInUp" data-wow-delay="0.5s">
            <label for="reset-email" class="form-label small fw-bold text-dark text-uppercase mb-1" style="letter-spacing: 0.5px; font-size: 0.72rem;">Email Address</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-0 rounded-pill-start ps-3">
                <i class="fa-regular fa-envelope text-muted"></i>
              </span>
              <input
                type="email"
                id="reset-email"
                class="form-control custom-input border-0 bg-light rounded-pill-end py-2 pe-3"
                placeholder="name@example.com"
                value="yousefelgamily72@gmail.com"
                required
              />
            </div>
          </div>

          <!-- Feedback alert -->
          <div id="send-alert" class="rounded-3 px-3 py-2 mb-2 small fw-semibold" style="display:none;"></div>

          <button type="submit" id="send-btn" class="btn btn-primary w-100 rounded-pill py-2 mt-2 fw-bold primary-btn h-50 wow animate__animated animate__fadeInUp" data-wow-delay="0.6s">
            <span id="btn-text">Send Code</span>
            <span id="btn-spinner" class="spinner-border spinner-border-sm ms-2" style="display:none;"></span>
          </button>
        </form>

        <!-- Back link -->
        <div class="text-center mt-4 wow animate__animated animate__fadeIn" data-wow-delay="0.7s">
          <a href="login.html" class="small fw-bold text-decoration-none text-primary">
            <i class="fa-solid fa-arrow-left me-1"></i> Back to Login
          </a>
        </div>
      </div>

      <!-- Footer -->
      <p class="text-muted mt-4 wow animate__animated animate__fadeIn" data-wow-delay="0.9s" style="font-size: 0.65rem; letter-spacing: 1px; text-transform: uppercase;">
        © 2026 Cartify. Secure Authentication.
      </p>
    </div>

    <!-- Scripts -->
    <script src="./Js/all.min.js"></script>
    <script src="./Js/wow.min.js"></script>
    <script>new WOW().init();</script>
    <script src="./Js/jquery.slim.min.js"></script>
    <script src="./Js/popper.min.js"></script>
    <script src="./Js/bootstrap.min.js"></script>
    <script src="./Js/mdb.umd.min.js"></script>
    <script>
      // ---- EmailJS init ----
      emailjs.init('u8_h9iHdCwDnhsTbl');

      document.getElementById('forgot-form').addEventListener('submit', function(e) {
        e.preventDefault();

        var email   = document.getElementById('reset-email').value.trim();
        var btn     = document.getElementById('send-btn');
        var btnText = document.getElementById('btn-text');
        var spinner = document.getElementById('btn-spinner');
        var alert   = document.getElementById('send-alert');

        // Generate 6-digit OTP
        var otp = Math.floor(100000 + Math.random() * 900000).toString();

        // Store OTP + target email for verify page
        sessionStorage.setItem('cartify_otp',   otp);
        sessionStorage.setItem('cartify_email', email);

        // Loading state
        btn.disabled    = true;
        btnText.textContent = 'Sending...';
        spinner.style.display = 'inline-block';
        alert.style.display   = 'none';

        emailjs.send('service_8j6ecwe', 'template_jam3qg9', {
          to_email: email,
          otp_code: otp
        })
        .then(function() {
          // Success — navigate to verify page
          window.location.href = 'verify-email.html';
        })
        .catch(function(err) {
          // Error — show actual error details for debugging
          btn.disabled = false;
          btnText.textContent = 'Send Code';
          spinner.style.display = 'none';
          alert.style.display = 'block';
          alert.style.background = '#fef2f2';
          alert.style.color = '#dc2626';
          var errMsg = (err && err.text) ? err.text : (err && err.message) ? err.message : JSON.stringify(err);
          alert.innerHTML = '<i class="fa-solid fa-circle-exclamation me-1"></i><strong>Error ' + (err && err.status ? err.status : '') + ':</strong> ' + errMsg;
          console.error('EmailJS full error:', err);
        });
      });
    </script>
  </body>
</html>
