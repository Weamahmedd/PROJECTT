<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cartify — Password Reset Successfully</title>
    <meta name="description" content="Your Cartify account password has been reset successfully." />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet" />

    <!-- Animate CSS -->
    <link rel="stylesheet" href="./CSS/animate.min.css" />
    <!-- WOW CSS -->
    <link rel="stylesheet" href="./CSS/wow.min.css" />
    <!-- Font Awesome -->
    <link rel="stylesheet" href="./CSS/all.min.css" />
    <!-- Bootstrap -->
    <link rel="stylesheet" href="./CSS/bootstrap.min.css" />
    <!-- MDB Bootstrap -->
    <link rel="stylesheet" href="./CSS/mdb.min.css" />
    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="./CSS/Style.css" />
    <!-- Auth Screens -->
    <link rel="stylesheet" href="./CSS/auth-screens.css" />
  </head>

  <body class="auth-page min-vh-100 d-flex flex-column align-items-center justify-content-center bg-light m-0">
    <div class="container d-flex flex-column align-items-center px-3">


      <!-- Card -->
      <div class="login-container bg-white rounded-5 shadow-lg p-5 text-center animate__animated animate__zoomIn animate__faster" style="max-width: 520px; width: 100%;">

        <!-- Success Icon -->
        <div class="d-flex align-items-center justify-content-center mx-auto mb-4 wow animate__animated animate__bounceIn" data-wow-delay="0.3s">
          <div class="auth-icon-circle auth-icon-circle--success">
            <i class="fa-solid fa-check" style="color: #ffffff;"></i>
          </div>
        </div>

        <!-- Title -->
        <div class="mb-4 wow animate__animated animate__fadeInUp" data-wow-delay="0.4s">
          <h1 class="h4 fw-bold mb-1 header-title">Password Reset</h1>
          <h2 class="h4 fw-bold" style="color: var(--primary-light);">Successfully</h2>
        </div>

        <!-- Description -->
        <p class="text-muted small mb-4 wow animate__animated animate__fadeInUp" data-wow-delay="0.5s">
          Your password has been updated. You can now<br>log in with your new credentials.
        </p>

        <!-- CTA Button -->
        <div class="wow animate__animated animate__fadeInUp" data-wow-delay="0.6s">
          <a href="login.html" class="btn btn-primary w-100 rounded-pill py-2 fw-bold primary-btn h-50 text-decoration-none">
            Back to Login <i class="fa-solid fa-arrow-right ms-1"></i>
          </a>
        </div>
      </div>

      <!-- Footer -->
      <p class="text-muted mt-4 wow animate__animated animate__fadeIn" data-wow-delay="0.9s" style="font-size: 0.65rem; letter-spacing: 1px; text-transform: uppercase;">
        © 2026 Cartify. Secure Authentication.
      </p>
    </div>

    <!-- Scripts -->
    <script src="./Js/all.min.js"></script>
    <script src="./Js/wow.min.js"></script>
    <script>new WOW().init();</script>
    <script src="./Js/jquery.slim.min.js"></script>
    <script src="./Js/popper.min.js"></script>
    <script src="./Js/bootstrap.min.js"></script>
    <script src="./Js/mdb.umd.min.js"></script>
  </body>
</html>
